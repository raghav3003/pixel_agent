[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldjudge"
version = "0.1.0"
description = "Gold-trajectory-conditioned LLM-as-judge for computer-use agent failure analysis"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
judge = ["openai>=1.30", "anthropic>=0.30", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
indent-width = 2
